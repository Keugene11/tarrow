name: Android build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "versionName"
        required: true
        default: "1.0.0"
      publish:
        description: "Upload the AAB to Google Play internal testing (needs the app to exist in Play Console)"
        type: boolean
        default: false
  push:
    branches: [master]
    paths: ["android/**", "capacitor.config.ts", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Sync Capacitor Android
        run: |
          pnpm cap:prepare
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default "tools" package was removed from the SDK repository.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/tarrow-release.jks

      - name: Build signed AAB + APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version || '1.0.0' }}
          KEYSTORE_FILE: ${{ runner.temp }}/tarrow-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          find app/build/outputs -name "*.aab" -o -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Tarrow-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

      - name: Publish to Play internal testing
        if: ${{ inputs.publish }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tarrow.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
